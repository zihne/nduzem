name: opaqueshare
description: Privacy-first, zero-knowledge file transfer client.
publish_to: none

# Version scheme: MAJOR.MINOR.PATCH+BUILD. BUILD is a monotonic counter that
# store submissions bump so the same source can be re-signed without a version
# regression. See docs/adr/0001-client-architecture.md.
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter: { sdk: flutter }

  # State: Riverpod without codegen — smaller build, faster iteration for M1.
  # A future milestone can add riverpod_generator when the provider surface grows.
  flutter_riverpod: ^2.6.1

  # Declarative routing + deep-link handling for the email-verification link.
  go_router: ^14.6.2

  # libsodium (X25519, Ed25519, secretstream, crypto_box_seal). One line of
  # Dart, one FFI call per primitive — the crypto stack the spec targets.
  sodium_libs: ^3.4.4

  # Hardware-backed keystore. Private keys never leave here.
  flutter_secure_storage: ^9.2.2

  # HTTP. Small enough that the M1 auth path doesn't need dio.
  http: ^1.2.2

  # For SHA-256 used in the safety-number / fingerprint helper.
  crypto: ^3.0.6

  # Launch `otpauth://` URLs so the OS routes to the installed
  # authenticator app (fixes same-device MFA enrolment — the QR path
  # only works when the authenticator is on a separate device).
  url_launcher: ^6.3.1

  # QR rendering. Used by the MFA enrolment screen so users with an
  # authenticator on a separate device can point-and-scan.
  qr_flutter: ^4.1.0

  # Android-only: fine-grained intent-flag control so custom-scheme
  # launches (otpauth://) land in a fresh task instead of being
  # absorbed into ours. `url_launcher` doesn't expose the flags.
  android_intent_plus: ^5.3.0

  # File picker for the M2 send flow (choose a file to encrypt + upload).
  file_picker: ^8.1.4

  # MIME sniffing for the encrypted enc_header, so the receiver knows
  # what to Save-As / how to open the decrypted plaintext.
  mime: ^2.0.0

  # Cross-platform temp/dest directories for the M2 receive flow
  # (download → decrypt → write).
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  # Generates Android + iOS launcher icons from `assets/branding/app_icon.png`
  # (main square) and `app_icon_foreground.png` (Android adaptive foreground).
  # Regenerate with:  dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.2

# Configuration for `flutter_launcher_icons`. Colour matches the Material
# seedColor in lib/app.dart. Swap the source PNGs whenever the real logo
# lands — the config below stays.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon.png"
  # Android 8+ adaptive icons — background solid colour, foreground PNG.
  adaptive_icon_background: "#673AB7"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 21
  # Remove the alpha channel from the iOS icon per Apple's requirement.
  remove_alpha_ios: true

# Flutter-tool config. Bundles the Material Icons font (`MaterialIcons`) so
# every `Icons.*` glyph — eye toggle, send, inbox, copy, shield, … — renders
# instead of falling back to the "missing glyph" square. Without this flag
# the font simply isn't in the APK.
flutter:
  uses-material-design: true
